name: build-android-node

# Build a stock Node.js LTS as an Android arm64 EXECUTABLE.
#
# Why this exists (see docs/02-sds.md):
#   * Node's Android cross-compile is Linux-only (android_configure.py exits 1 elsewhere),
#     and this machine has no WSL and no admin rights -> build on a Linux runner.
#   * We deliberately do NOT pass --shared. configure.py's --shared default is None,
#     so the default output is an executable. A .so cannot be execve'd from an APK
#     (fogtape/nodejs-mobile artifacts are ET_DYN with e_entry=0x0 -> ENOEXEC).
#   * full-icu is the default, and is REQUIRED: src/users.js:645 calls
#     String.prototype.normalize() on the login path; an intl=none build cannot log in.
#   * 16 KB page alignment comes from NDK r28+ linker defaults, NOT from LDFLAGS
#     (configure.py has no --ldflags option and never reads $LDFLAGS - verified).

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: 'Node version to build (LTS)'
        required: false
        default: '24.22.2'
      ndk_version:
        description: 'NDK version (r28+ for 16KB defaults)'
        required: false
        default: '28.2.13676358'
      arch:
        description: 'Target arch'
        required: false
        default: 'arm64'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: ['arm64']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # NOTE: do NOT use android-actions/setup-android@v3 here.
      # It internally runs `sdkmanager --install tools`, but the legacy "tools"
      # package no longer exists in current SDK repositories, so the action fails
      # with "Failed to find package 'tools'" before any of our steps run.
      # ubuntu runners already ship a working SDK + cmdline-tools, so use them directly.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}" >> "$GITHUB_ENV"

      - name: Install NDK ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          # find a usable sdkmanager (cmdline-tools/<ver>/bin)
          SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMGR" ]; then
            echo "No sdkmanager found; downloading cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "using $SDKMGR"

          # Accept licenses. `yes | sdkmanager` dies with SIGPIPE ("yes: standard output:
          # Broken pipe") once sdkmanager exits, and under `set -e`/pipefail that aborts
          # the job. Feed a finite list instead and tolerate the exit code.
          printf 'y\n%.0s' $(seq 1 200) > /tmp/lic.txt
          "$SDKMGR" --sdk_root="$SDK" --licenses < /tmp/lic.txt > /tmp/lic.log 2>&1 || true
          tail -3 /tmp/lic.log || true

          # Install the NDK. Same reasoning: feed stdin, and only trust the resulting dir.
          "$SDKMGR" --sdk_root="$SDK" --install "ndk;${{ inputs.ndk_version }}" < /tmp/lic.txt > /tmp/ndk-install.log 2>&1 || true
          if [ ! -d "$SDK/ndk/${{ inputs.ndk_version }}" ]; then
            echo "NDK install failed; tail of log:"
            tail -60 /tmp/ndk-install.log
            exit 1
          fi
          echo "NDK_ROOT=$SDK/ndk/${{ inputs.ndk_version }}" >> "$GITHUB_ENV"
          cat "$SDK/ndk/${{ inputs.ndk_version }}/source.properties"

      - name: Fetch Node source
        run: |
          set -euo pipefail
          V="${{ inputs.node_version }}"
          curl -fsSLO "https://nodejs.org/dist/v${V}/node-v${V}.tar.gz"
          tar -xzf "node-v${V}.tar.gz"
          echo "NODE_SRC=$GITHUB_WORKSPACE/node-v${V}" >> "$GITHUB_ENV"

      - name: Verify build prerequisites (fail fast)
        run: |
          set -euo pipefail
          cd "$NODE_SRC"
          echo "--- android_configure.py contract ---"
          # Must take exactly 3 positional args and must NOT read ANDROID_NDK_HOME/ANDROID_API.
          grep -n 'len(sys.argv) != 4' android_configure.py
          if grep -qE 'ANDROID_NDK_HOME|ANDROID_API' android_configure.py; then
            echo "Unexpected: android_configure.py reads env vars"; exit 1
          fi
          echo "--- --shared default must be None (we want an executable) ---"
          grep -n "'--shared'" -A4 configure.py
          echo "--- --with-intl default must be full-icu (login needs ICU) ---"
          grep -n "with-intl" -A6 configure.py | head -30
          echo "--- configure.py must NOT support --ldflags (16KB comes from NDK) ---"
          if grep -q -- '--ldflags' configure.py; then echo "unexpected --ldflags"; fi

      - name: Apply Node Android patches
        run: |
          set -euo pipefail
          chmod +x tools/apply-node-android-patches.sh
          ./tools/apply-node-android-patches.sh "$NODE_SRC"

      - name: Cross-compile Node (executable, full-icu)
        run: |
          set -euo pipefail
          cd "$NODE_SRC"
          # B2 fix: upstream android_configure.py sets only CC/CXX (cross compilers) and
          # never CC_host, so host_arch misdetects as arm64 and host tools (node_js2c,
          # torque, mksnapshot, genccode) get built as ARM binaries that cannot run here.
          # Use gcc/g++ (guaranteed present on ubuntu runners); an EMPTY value would make
          # configure.py fall back to the cross CC and silently reinstate the bug.
          export CC_host="$(command -v gcc)"
          export CXX_host="$(command -v g++)"
          test -n "$CC_host"  || { echo "CC_host empty"; exit 1; }
          test -n "$CXX_host" || { echo "CXX_host empty"; exit 1; }
          echo "CC_host=$CC_host"
          echo "CXX_host=$CXX_host"

          # Exactly 3 positional args: <ndk> <api> <arch>
          ./android-configure "$NDK_ROOT" 26 ${{ matrix.arch }}

          echo "--- verify hosts tools will be x86_64 (B2) ---"
          grep -E "^CC_host|^CXX_host" config.gypi config.mk 2>/dev/null || true

          NPROC="$(nproc)"
          echo "building with -j${NPROC}"
          make -j"${NPROC}" 2>&1 | tail -200

      - name: Verify ELF properties (hard gates)
        run: |
          set -euo pipefail
          cd "$NODE_SRC"
          BIN=out/Release/node
          test -f "$BIN" || { echo "FATAL: no $BIN produced"; ls -la out/Release 2>/dev/null | head; exit 1; }
          READELF="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "=== 1. must be an EXECUTABLE (not a shared lib) ==="
          "$READELF" -h "$BIN" | grep -E 'Class:|Type:|Machine:|Entry point'
          TYPE_LINE="$("$READELF" -h "$BIN" | grep 'Type:')"
          ENTRY="$("$READELF" -h "$BIN" | grep 'Entry point address:' | awk '{print $NF}')"
          echo "Type=$TYPE_LINE  Entry=$ENTRY"
          # e_entry == 0 means ET_DYN shared object -> execve would ENOEXEC
          if [ "$ENTRY" = "0x0" ]; then echo "FATAL: e_entry==0 -> shared library, not executable"; exit 1; fi

          echo "=== 2. 16 KB page alignment on every PT_LOAD ==="
          # Pure POSIX shell arithmetic with 16#hex (bash builtin) - no awk strtonum,
          # no python heredoc, so this block is robust on the runner.
          "$READELF" -lW "$BIN" | grep -E '^\s+LOAD' > /tmp/loads.txt || true
          if [ ! -s /tmp/loads.txt ]; then echo "FATAL: no PT_LOAD segments"; exit 1; fi
          cat /tmp/loads.txt | while IFS= read -r line; do
            ALIGN=$(printf '%s' "$line" | awk '{print $NF}')
            OFF=$(printf '%s' "$line"   | awk '{print $2}')
            VA=$(printf '%s' "$line"    | awk '{print $3}')
            AI=$((ALIGN)); OI=$((OFF)); VI=$((VA))     # bash understands 0x.. in $((  ))
            echo "  off=$OFF va=$VA align=$ALIGN -> align=$AI"
            if [ "$AI" -ne 16384 ]; then echo "FATAL: p_align=$AI, expected 16384"; exit 1; fi
            if [ $(( (VI - OI) % 16384 )) -ne 0 ]; then
              echo "FATAL: (vaddr-offset)%16384 = $(( (VI - OI) % 16384 ))"; exit 1
            fi
          done
          echo "16KB alignment OK"

          echo "=== 3. full ICU alive (HARD GATE: login path depends on it) ==="
          # src/users.js:645 calls String.prototype.normalize() on the login path.
          # An --with-intl=none build starts fine and then can never log in - the
          # worst possible failure mode, so this must FAIL the build, not warn.
          #
          # We cannot execute an aarch64 binary on an x86_64 runner, so we verify
          # statically that ICU was linked in. Node embeds ICU data via genccode
          # (icu-generic.gyp), producing icudt*_dat symbols plus ucol_/unorm2_ APIs.
          ICU_COUNT="$("$READELF" -sW "$BIN" 2>/dev/null | grep -cE 'ucol_|unorm2_|icu_|icudt' || true)"
          echo "ICU-related symbols: $ICU_COUNT"
          if [ "${ICU_COUNT:-0}" -lt 10 ]; then
            echo "FATAL: only $ICU_COUNT ICU symbols in the binary."
            echo "This looks like an --with-intl=none / small-icu build."
            echo "Such a build CANNOT log in (src/users.js:645 uses String.normalize())."
            echo "Refusing to ship it. Check that --with-intl defaults to full-icu."
            exit 1
          fi
          echo "ICU symbols present ($ICU_COUNT) -> full ICU statically embedded"

          # Extra confirmation: the embedded ICU data blob (genccode output).
          if "$READELF" -sW "$BIN" 2>/dev/null | grep -qE 'icudt[0-9]+_dat'; then
            echo "embedded ICU data blob (icudt*_dat) found"
          else
            echo "WARN: no icudt*_dat symbol; ICU may be linked but not data-embedded"
          fi

          echo "=== 4. size ==="
          ls -lh "$BIN"
          file "$BIN" || true

      - name: Package artifact
        run: |
          set -euo pipefail
          cd "$NODE_SRC"
          mkdir -p dist
          cp out/Release/node dist/libnode-${{ matrix.arch }}
          cp out/Release/libc++_shared.so dist/ 2>/dev/null || \
            cp "$NDK_ROOT"/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so dist/ 2>/dev/null || \
            echo "libc++_shared.so not found (may be static)"
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded dist/libnode-${{ matrix.arch }} || true
          ( cd dist && sha256sum * > SHA256SUMS && ls -la )
          echo "=== artifact contents ==="
          find dist -type f -printf '%p %s bytes\n'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: node-android-${{ matrix.arch }}
          path: ${{ env.NODE_SRC }}/dist/*
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Node ${{ inputs.node_version }} for Android ${{ matrix.arch }}"
            echo ""
            echo "| property | value |"
            echo "|---|---|"
            echo "| NDK | ${{ inputs.ndk_version }} |"
            echo "| Type | $("$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$NODE_SRC/out/Release/node" | grep 'Type:' | xargs) |"
            echo "| Entry | $("$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$NODE_SRC/out/Release/node" | grep 'Entry point address' | xargs) |"
            echo "| Size | $(du -h "$NODE_SRC/out/Release/node" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
